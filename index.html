<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Cloud Resources</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Classroom Cloud Resources</h1>
        <p>Access academic materials in one place.</p>
    </header>

    <main>
        <section class="upload-card">
            <h2>Add Resource</h2>
            <form id="resourceForm">
                <input id="title" type="text" placeholder="Resource title" required>

                <select id="subject" required>
                    <option value="">Select subject</option>
                    <option value="Cloud Computing">Cloud Computing</option>
                    <option value="DBMS">DBMS</option>
                    <option value="Operating Systems">Operating Systems</option>
                    <option value="Data Structures">Data Structures</option>
                    <option value="Theory of Computation">Theory of Computation</option>
                </select>

                <select id="resourceType" required>
                    <option value="">Resource type</option>
                    <option value="Notes">Notes</option>
                    <option value="Lab Manual">Lab Manual</option>
                    <option value="Question Paper">Question Paper</option>
                    <option value="Reference">Reference</option>
                </select>

                <input id="unit" type="text" placeholder="Unit / Topic" required>
                <input id="link" type="url" placeholder="Cloud file URL" required>

                <button type="submit">Add Resource</button>
            </form>
            <p id="status"></p>
        </section>

        <section>
            <div class="section-heading">
                <h2>Available Resources</h2>
                <input id="search" type="search" placeholder="Search resources...">
            </div>

            <div class="filters">
                <select id="subjectFilter">
                    <option value="">All Subjects</option>
                    <option value="Cloud Computing">Cloud Computing</option>
                    <option value="DBMS">DBMS</option>
                    <option value="Operating Systems">Operating Systems</option>
                    <option value="Data Structures">Data Structures</option>
                    <option value="Theory of Computation">Theory of Computation</option>
                </select>
            </div>

            <div id="resources" class="resource-grid"></div>
        </section>
    </main>

    <footer>
        <p>Cloud Computing Mini Project</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
